name: pt-interactuar-backend

services:
  postgres:
    image: postgres:17-alpine
    container_name: pt-interactuar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pt_user
      POSTGRES_PASSWORD: pt_password
      POSTGRES_DB: pt_interactuar_dev
    ports:
      # 5433 en el host, no 5432: esta maquina tiene un PostgreSQL nativo
      # (servicio de Windows "postgresql-x64-18") que ya ocupa el 5432 y
      # competia con el de Docker por las conexiones a localhost:5432,
      # causando fallos de autenticacion intermitentes contra el usuario
      # equivocado. El puerto interno del contenedor sigue siendo 5432.
      - '5433:5432'
    volumes:
      - pt_interactuar_pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pt_user -d pt_interactuar_dev']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pt_interactuar_pgdata:
    name: pt_interactuar_pgdata
